name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

      # La misma compilación, pero colgando de la raíz en vez de /negra40/,
      # para subir a negra40.com.ar. Copiar la carpeta de arriba no sirve: las
      # rutas de imágenes, estilos y enlaces llevan el prefijo adentro.
      - name: Build para el dominio propio
        env:
          SITE_BASE: /
          SITE_URL: https://negra40.com.ar
        run: npm run build -- --outDir dist-dominio

      - name: Upload sitio para el dominio propio
        uses: actions/upload-artifact@v4
        with:
          name: sitio-negra40.com.ar
          path: ./dist-dominio
          retention-days: 30

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
